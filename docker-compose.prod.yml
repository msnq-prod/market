x-runtime-build: &runtime-build
  context: .
  dockerfile: Dockerfile
  target: runtime
  args:
    VITE_VIDEO_HELPER_DOWNLOAD_URL: ${VITE_VIDEO_HELPER_DOWNLOAD_URL:-}
    VITE_SENTRY_DSN_FRONTEND: ${SENTRY_DSN_FRONTEND:-}
    VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *json-logging

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - stones_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *json-logging

  app:
    image: stones-runtime:prod
    build: *runtime-build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      TELEGRAM_TOKEN_ENCRYPTION_KEY: ${TELEGRAM_TOKEN_ENCRYPTION_KEY:?TELEGRAM_TOKEN_ENCRYPTION_KEY is required}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      PORT: ${PORT:-3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-0}
      LOG_SLOW_QUERY_MS: ${LOG_SLOW_QUERY_MS:-250}
      LOG_PAYLOAD_MAX_BYTES: ${LOG_PAYLOAD_MAX_BYTES:-8192}
      LOG_REDACT_FIELDS: ${LOG_REDACT_FIELDS:-authorization,cookie,set-cookie,password,token,refreshToken,accessToken,encrypted_token,secret,key}
      SENTRY_DSN_BACKEND: ${SENTRY_DSN_BACKEND:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      RUN_MIGRATIONS: "1"
      NODE_ENV: production
    volumes:
      - stones_uploads:/app/public/uploads
      - stones_video_jobs:/app/storage/video-jobs
      - stones_video_exports:/app/storage/video-export
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '3001') + '/healthz').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *json-logging

  video-processor:
    image: stones-runtime-video:prod
    build:
      <<: *runtime-build
      target: video-runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["node", "build/server/videoProcessor.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      VIDEO_PROCESSOR_POLL_MS: ${VIDEO_PROCESSOR_POLL_MS:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-0}
      LOG_SLOW_QUERY_MS: ${LOG_SLOW_QUERY_MS:-250}
      LOG_PAYLOAD_MAX_BYTES: ${LOG_PAYLOAD_MAX_BYTES:-8192}
      LOG_REDACT_FIELDS: ${LOG_REDACT_FIELDS:-authorization,cookie,set-cookie,password,token,refreshToken,accessToken,encrypted_token,secret,key}
      SENTRY_DSN_BACKEND: ${SENTRY_DSN_BACKEND:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      RUN_MIGRATIONS: "0"
      NODE_ENV: production
    volumes:
      - stones_uploads:/app/public/uploads
      - stones_video_jobs:/app/storage/video-jobs
      - stones_video_exports:/app/storage/video-export
    healthcheck:
      test: ["CMD-SHELL", "ps -o args | grep -q '[n]ode build/server/videoProcessor.js'"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *json-logging

  telegram-worker:
    image: stones-runtime:prod
    build: *runtime-build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["node", "build/server/telegramWorker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      TELEGRAM_TOKEN_ENCRYPTION_KEY: ${TELEGRAM_TOKEN_ENCRYPTION_KEY:?TELEGRAM_TOKEN_ENCRYPTION_KEY is required}
      TELEGRAM_WORKER_POLL_MS: ${TELEGRAM_WORKER_POLL_MS:-5000}
      TELEGRAM_WORKER_RETRY_BASE_MS: ${TELEGRAM_WORKER_RETRY_BASE_MS:-5000}
      TELEGRAM_WORKER_MAX_ATTEMPTS: ${TELEGRAM_WORKER_MAX_ATTEMPTS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-0}
      LOG_SLOW_QUERY_MS: ${LOG_SLOW_QUERY_MS:-250}
      LOG_PAYLOAD_MAX_BYTES: ${LOG_PAYLOAD_MAX_BYTES:-8192}
      LOG_REDACT_FIELDS: ${LOG_REDACT_FIELDS:-authorization,cookie,set-cookie,password,token,refreshToken,accessToken,encrypted_token,secret,key}
      SENTRY_DSN_BACKEND: ${SENTRY_DSN_BACKEND:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      RUN_MIGRATIONS: "0"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "ps -o args | grep -q '[n]ode build/server/telegramWorker.js'"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *json-logging

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    logging: *json-logging

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    depends_on:
      - loki
    volumes:
      - ./docker/observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp
    logging: *json-logging

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging: *json-logging

volumes:
  caddy_config:
  caddy_data:
  grafana_data:
  loki_data:
  promtail_positions:
  stones_mysql_data:
  stones_uploads:
  stones_video_jobs:
  stones_video_exports:
